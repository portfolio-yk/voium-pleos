<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101216">
    <meta name="description" content="대화의 흐름을 따라, 화자를 구분해 보여주는 실시간 자막.">
    <title>대화 자막</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="caption-app">
      <header class="app-bar">
        <button id="status-button" class="status-button" type="button" aria-label="마이크 시작">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-label">연결 확인 중</span>
        </button>
        <button id="settings-button" class="settings-button" type="button" aria-label="설정" title="설정">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9.7 3-.5 2a7.5 7.5 0 0 0-1.7 1L5.5 5.4 3.2 9.3l1.5 1.4a8 8 0 0 0 0 2.6l-1.5 1.4 2.3 3.9 2-.6a7.5 7.5 0 0 0 1.7 1l.5 2h4.6l.5-2a7.5 7.5 0 0 0 1.7-1l2 .6 2.3-3.9-1.5-1.4a8 8 0 0 0 0-2.6l1.5-1.4-2.3-3.9-2 .6a7.5 7.5 0 0 0-1.7-1l-.5-2Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </header>

      <main id="caption-window" class="caption-window" role="region" aria-label="대화 자막" tabindex="0">
        <div id="conversation" class="conversation"></div>
        <div id="empty-state" class="empty-state">
          <h1 id="empty-title">대화를 시작하면<br>이곳에 자막이 나타나요</h1>
          <p id="empty-description">왼쪽 위 버튼을 눌러 시작하세요.</p>
        </div>
      </main>

      <button id="latest-button" class="latest-button" type="button" hidden>
        <span>최신 자막</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14m-5-5 5 5 5-5"/>
        </svg>
      </button>
      <div id="notice" class="notice" role="status" hidden>
        <span id="notice-text"></span>
      </div>
      <p id="error-message" class="error-message" role="alert" hidden></p>
    </div>
  </body>
</html>
